<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirectHireHub - Verified Walk-in Drives & Direct Hiring in India</title>
  <meta name="description" content="Find daily updated verified walk-in drives, corporate interview venues, and direct hiring opportunities across Delhi NCR, Gurgaon, Noida, and Bangalore.">
  <link rel="canonical" href="https://directhirehub.in/">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --badge-bg: #e0e7ff;
      --badge-text: #3730a3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; padding: 20px 16px; max-width: 900px; margin: 0 auto; }
    header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    header h1 { font-size: 26px; color: var(--text-main); margin-bottom: 6px; }
    header p { color: var(--text-muted); font-size: 15px; }
    .job-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .job-badge { display: inline-block; background: var(--badge-bg); color: var(--badge-text); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 8px; }
    .job-title { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .job-meta { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
    .job-desc { font-size: 14px; color: #334155; margin-bottom: 16px; white-space: pre-line; }
    .btn-reveal { background: var(--primary); color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-reveal:hover { background: var(--primary-hover); }
    .venue-box { display: none; margin-top: 16px; padding: 16px; background: #ffffff; border: 1px solid var(--border); border-radius: 8px; }
    .ad-placeholder { min-height: 250px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border-radius: 6px; font-size: 13px; color: #64748b; }
    .venue-details h4 { font-size: 15px; margin-bottom: 6px; color: var(--text-main); }
    .venue-details p { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
    .venue-details ul { padding-left: 20px; font-size: 13px; color: #334155; }
  </style>
</head>
<body>

  <header>
    <h1>DirectHireHub.in</h1>
    <p>Daily Verified Walk-In Drives & Corporate Hiring in India</p>
  </header>

  <main id="job-container">
    <p style="text-align:center; color:#64748b;">Loading verified opportunities...</p>
  </main>

  <script>
    async function loadJobs() {
      try {
        const res = await fetch('jobs.json?t=' + Date.now());
        const jobs = await res.json();
        const container = document.getElementById('job-container');
        container.innerHTML = '';

        jobs.forEach(job => {
          const schema = {
            "@context": "https://schema.org/",
            "@type": "JobPosting",
            "title": job.title,
            "description": job.description,
            "datePosted": job.date_posted,
            "validThrough": job.valid_through,
            "employmentType": job.type,
            "hiringOrganization": {
              "@type": "Organization",
              "name": job.company
            },
            "jobLocation": {
              "@type": "Place",
              "address": {
                "@type": "PostalAddress",
                "addressLocality": job.city,
                "addressRegion": job.state,
                "addressCountry": "IN"
              }
            },
            "baseSalary": {
              "@type": "MonetaryAmount",
              "currency": "INR",
              "value": {
                "@type": "QuantitativeValue",
                "minValue": job.salary_min,
                "maxValue": job.salary_max,
                "unitText": "YEAR"
              }
            }
          };
          const scriptTag = document.createElement('script');
          scriptTag.type = 'application/ld+json';
          scriptTag.text = JSON.stringify(schema);
          document.head.appendChild(scriptTag);

          const card = document.createElement('article');
          card.className = 'job-card';
          card.innerHTML = `
            <span class="job-badge">Verified Walk-In</span>
            <h2 class="job-title">${job.title}</h2>
            <p class="job-meta"><strong>${job.company}</strong> • ${job.city}, ${job.state} • ₹${(job.salary_min/100000).toFixed(1)} - ₹${(job.salary_max/100000).toFixed(1)} LPA</p>
            <p class="job-desc">${job.description}</p>
            <button class="btn-reveal" onclick="unlockVenue(${job.id})">📍 View Walk-in Venue & Timings</button>
            <div id="venue-${job.id}" class="venue-box">
              <div class="ad-placeholder">Adsterra 300x250 Ad Display</div>
              <div class="venue-details">
                <h4>Interview Reporting Venue:</h4>
                <p>📍 ${job.venue}</p>
                <p>🚇 Nearest Metro/Landmark: ${job.metro}</p>
                <p>⏰ Timing: ${job.timing}</p>
                <h4>Checklist to Carry:</h4>
                <ul>${job.checklist.map(item => `<li>${item}</li>`).join('')}</ul>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function unlockVenue(id) {
      const box = document.getElementById('venue-' + id);
      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
      }
    }

    loadJobs();
  </script>
</body>
</html>
